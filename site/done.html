<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7f5">
  <title>Booking received · Uma Devi</title>
  <link rel="stylesheet" href="/vendor/uikit/css/uikit.min.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="app-header">
    <div class="uk-container app-header-inner">
      <nav class="uk-navbar" uk-navbar><div class="uk-navbar-left"><a class="app-brand" href="/">Uma Devi</a></div></nav>
    </div>
  </header>
  <section class="uk-section uk-section-small">
    <div class="uk-container app-column">
      <div class="uk-card uk-card-default uk-card-body uk-text-center">
        <span class="app-check" uk-icon="icon: check; ratio: 2"></span>
        <h1 class="uk-h3 uk-margin-small-top uk-margin-remove-bottom">Booking received</h1>
        <p class="uk-h2 uk-margin-small" id="reference"></p>
        <span class="uk-label" id="status">Held</span>
        <div class="uk-alert uk-alert-success app-alert uk-text-left uk-margin-small-top" uk-alert>
          <p class="app-alert-line"><span uk-icon="icon: check; ratio: 0.85"></span><span>This time is held. Uma confirms it before she comes.</span></p>
        </div>
        <p class="uk-text-meta" id="when"></p>
        <a class="uk-button uk-button-primary uk-width-1-1 uk-margin-small-top" id="whatsapp" href="#">Send on WhatsApp</a>
        <a class="uk-button uk-button-default uk-width-1-1 uk-margin-small-top" href="/">Back to home</a>
        <a class="uk-button uk-button-text uk-margin-small-top" id="review-link" href="/review">Rate this visit after it ends</a>
      </div>
    </div>
  </section>
  <script src="/vendor/uikit/js/uikit.min.js"></script>
  <script src="/vendor/uikit/js/uikit-icons.min.js"></script>
  <script src="/ui.js"></script>
  <script>
    const saved = JSON.parse(sessionStorage.getItem("uma_devi_done") || "null");
    if (!saved) location.replace("/book");
    else {
      const U = window.Uma;
      document.getElementById("reference").textContent = saved.reference;
      document.getElementById("when").textContent = U.dateLabel(saved.date) + ", " + U.clockLabel(saved.start) + " – " + U.clockLabel(saved.end) + " · " + saved.locality;
      const text = "Booking " + saved.reference + "\n" + saved.packageName + "\n" + U.dateLabel(saved.date) + ", " + U.clockLabel(saved.start) + " – " + U.clockLabel(saved.end) + "\n" + saved.locality;
      document.getElementById("whatsapp").href = "https://wa.me/919959923543?text=" + encodeURIComponent(text);
      document.getElementById("review-link").href = "/review?reference=" + encodeURIComponent(saved.reference);
      U.notify("Booking received.");
    }
  </script>
</body>
</html>
