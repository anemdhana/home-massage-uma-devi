<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7f5">
  <title>Booking received · Aura wellness</title>
  <link rel="stylesheet" href="/vendor/uikit/css/uikit.min.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="app-header">
    <div class="uk-container app-header-inner">
      <nav class="uk-navbar" uk-navbar><div class="uk-navbar-left"><a class="app-brand" href="/about"><span class="app-logo"><img src="/aura-logo.png" alt=""></span><span class="app-brand-copy"><span class="app-brand-name">Aura wellness</span><span class="app-brand-caption">Wellness at your doorstep</span></span></a></div></nav>
    </div>
  </header>
  <section class="uk-section uk-section-small">
    <div class="uk-container app-column">
      <div class="uk-card uk-card-default uk-card-body uk-text-center">
        <span class="app-check" uk-icon="icon: check; ratio: 2"></span>
        <h1 class="uk-h3 uk-margin-small-top uk-margin-remove-bottom">Booking received</h1>
        <p class="uk-h2 uk-margin-small" id="reference"></p>
        <span class="uk-label" id="status">Held</span>
        <div class="uk-alert uk-alert-warning app-alert uk-text-left uk-margin-small-top" uk-alert>
          <p class="app-alert-line"><span uk-icon="icon: warning; ratio: 0.85"></span><span id="pay-note">Pay the advance on PhonePe. Put this reference in the note.</span></p>
        </div>
        <figure class="app-pay">
          <img src="/phonepe.jpeg" alt="PhonePe QR for UMADEVI VADLAMANI" width="720" height="1280">
          <figcaption>UMADEVI VADLAMANI · Scan in the PhonePe app</figcaption>
        </figure>
        <p class="uk-text-meta" id="when"></p>
        <a class="uk-button uk-button-primary uk-width-1-1 uk-margin-small-top" id="whatsapp" target="_blank" rel="noopener noreferrer" href="#"><span uk-icon="icon: whatsapp; ratio: 0.9"></span> Send booking to Uma on WhatsApp</a>
        <a class="uk-button uk-button-default uk-width-1-1 uk-margin-small-top" href="/">Back to home</a>
        <a class="uk-button uk-button-text uk-margin-small-top" id="review-link" href="/review">Rate this visit after it ends</a>
      </div>
    </div>
  </section>
  <script src="/vendor/uikit/js/uikit.min.js"></script>
  <script src="/vendor/uikit/js/uikit-icons.min.js"></script>
  <script src="/ui.js"></script>
  <script>
    const saved = JSON.parse(sessionStorage.getItem("uma_devi_done") || "null");
    if (!saved) location.replace("/book");
    else {
      const U = window.Uma;
      document.getElementById("reference").textContent = saved.reference;
      document.getElementById("when").textContent = U.dateLabel(saved.date) + ", " + U.clockLabel(saved.start) + " – " + U.clockLabel(saved.end) + " · " + saved.locality;
      const advance = Math.min(U.advanceInr, saved.priceInr || U.advanceInr);
      document.getElementById("pay-note").textContent = "Pay " + U.money(advance) + " advance on PhonePe. Put " + saved.reference + " in the note, then send this booking to Uma.";
      document.getElementById("whatsapp").href = U.umaWhatsappLink(saved);
      document.getElementById("review-link").href = "/review?reference=" + encodeURIComponent(saved.reference);
      U.notify("Booking received.");
    }
  </script>
</body>
</html>
