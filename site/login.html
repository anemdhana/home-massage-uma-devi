<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7f5">
  <title>Uma’s day · Sign in</title>
  <link rel="stylesheet" href="/vendor/uikit/css/uikit.min.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="app-header">
    <div class="uk-container app-header-inner">
      <nav class="uk-navbar" uk-navbar><div class="uk-navbar-left"><a class="app-brand" href="/">Uma Devi</a></div></nav>
    </div>
  </header>
  <section class="uk-section uk-section-small">
    <div class="uk-container app-column">
      <div class="uk-card uk-card-default uk-card-body">
        <h1 class="uk-h3 uk-margin-small-bottom">Uma’s day</h1>
        <div id="login-alert"></div>
        <form class="uk-form-stacked app-form" id="login-form">
          <div class="uk-margin-small">
            <label class="uk-form-label" for="mobile">Mobile</label>
            <input class="uk-input" id="mobile" inputmode="numeric" autocomplete="username" value="9959923543">
          </div>
          <div class="uk-margin-small">
            <label class="uk-form-label" for="password">Password</label>
            <input class="uk-input" id="password" type="password" autocomplete="current-password">
          </div>
          <button class="uk-button uk-button-primary uk-width-1-1 uk-margin-small-top" type="submit">Sign in</button>
        </form>
      </div>
    </div>
  </section>
  <script src="/vendor/uikit/js/uikit.min.js"></script>
  <script src="/vendor/uikit/js/uikit-icons.min.js"></script>
  <script src="/ui.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = event.target.querySelector("button");
      button.disabled = true;
      window.Uma.clearMessage(document.getElementById("login-alert"));
      try {
        await window.Uma.api("/auth/login", {
          method: "POST",
          body: { mobile: document.getElementById("mobile").value.trim(), password: document.getElementById("password").value },
        });
        location.href = "/uma";
      } catch (error) {
        button.disabled = false;
        window.Uma.showMessage(document.getElementById("login-alert"), "danger", error.message);
      }
    });
  </script>
</body>
</html>
